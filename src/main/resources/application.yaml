server:
  port: 8081
spring:
  application:
    name: redis
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/redis?useSSL=false&serverTimezone=UTC
    username: root
    password: "@Ljq770819"
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    time-zone: GMT+8                      # 时间用东八区，别用 UTC，否则差 8 小时
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss      # 接口接收的日期时间格式，例 2026-01-01 12:00:00
      date: yyyy-MM-dd                    # 只填日期时的格式，例 2000-01-01
mybatis-plus:
  type-aliases-package: com.redis.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug